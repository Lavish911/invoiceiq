spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://postgres:5432/invoiceiq_db}
    username: ${POSTGRES_USER:invoiceiq}
    password: ${POSTGRES_PASSWORD:invoiceiq_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    url: ${POSTGRES_URL:jdbc:postgresql://postgres:5432/invoiceiq_db}
    user: ${POSTGRES_USER:invoiceiq}
    password: ${POSTGRES_PASSWORD:invoiceiq_password}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  ocr:
    service:
      url: ${AI_SERVICE_URL:http://python-ocr:8000}
      connect-timeout: ${OCR_CONNECT_TIMEOUT:5}
      read-timeout: ${OCR_READ_TIMEOUT:120}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      dir: ${STORAGE_LOCAL_DIR:/app/data/storage}
    s3:
      bucket: ${S3_BUCKET:}
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

# JobRunr background job server: REQUIRED in every real runtime so enqueued
# extraction jobs are actually processed. Uses PostgreSQL storage. Deliberately
# absent from test profiles so tests keep deterministic, server-free behavior.
# NOTE: the property prefix must be "org.jobrunr" — a "jobrunr.*" entry binds
# to nothing and silently leaves defaults in place.
org:
  jobrunr:
    background-job-server:
      enabled: true
    dashboard:
      enabled: false
