spring:
  datasource:
    url: jdbc:postgresql://invoiceiq-postgres:5432/invoiceiq_db
    username: ${POSTGRES_USER:invoiceiq}
    password: ${POSTGRES_PASSWORD:invoiceiq_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    url: jdbc:postgresql://invoiceiq-postgres:5432/invoiceiq_db
    user: ${POSTGRES_USER:invoiceiq}
    password: ${POSTGRES_PASSWORD:invoiceiq_password}
    locations: classpath:db/migration
  data:
    redis:
      host: invoiceiq-redis
      port: 6379
