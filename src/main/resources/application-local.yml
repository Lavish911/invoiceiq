spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/invoiceiq_db
    username: invoiceiq
    password: invoiceiq_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/invoiceiq_db
    user: invoiceiq
    password: invoiceiq_password
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
