spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/invoiceiq_db
    username: invoiceiq
    password: invoiceiq_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # Must match the application-level 10 MB upload contract enforced in
      # DocumentService; without this the framework defaults apply first.
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/invoiceiq_db
    user: invoiceiq
    password: invoiceiq_password
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

app:
  demo:
    # Demo tenant UUID. Empty (default) disables all demo behavior, including
    # the upload quota and the hourly cleanup job.
    tenant-id: ${DEMO_TENANT_ID:}
    max-uploads-per-hour: ${DEMO_MAX_UPLOADS_PER_HOUR:20}
    max-bytes-total: ${DEMO_MAX_BYTES_TOTAL:209715200}
    retention-hours: ${DEMO_RETENTION_HOURS:24}

# JobRunr background job server: REQUIRED in every real runtime so enqueued
# extraction jobs are actually processed. Uses PostgreSQL storage. Deliberately
# absent from test profiles so tests keep deterministic, server-free behavior.
org:
  jobrunr:
    background-job-server:
      enabled: true
    dashboard:
      enabled: false
