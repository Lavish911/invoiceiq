spring:
  application:
    name: invoiceiq-backend
  profiles:
    active: local

server:
  # Railway injects PORT; default 8080 keeps local and Docker behavior unchanged.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000 # a day
      refresh-token:
        expiration: 604800000 # 7 days

# NOTE: JobRunr honors only the "org.jobrunr.*" prefix. A "jobrunr.*" entry
# binds to nothing, so JobRunr behavior is configured per runtime profile
# (application-local.yml / application-docker.yml), not here.
