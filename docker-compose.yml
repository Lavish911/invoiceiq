services:
  postgres:
    image: postgres:15-alpine
    container_name: invoiceiq-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoiceiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoiceiq_password}
      POSTGRES_DB: ${POSTGRES_DB:-invoiceiq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoiceiq} -d ${POSTGRES_DB:-invoiceiq_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: invoiceiq-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-ocr:
    build: ./python-ocr
    container_name: invoiceiq-ocr
    restart: always
    environment:
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-default_dev_token}
      # Fail fast if the OCR credential is missing or a known development
      # default (overridable to "false" for throwaway local experiments only).
      - OCR_REQUIRE_EXPLICIT_TOKEN=${OCR_REQUIRE_EXPLICIT_TOKEN:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoiceiq-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-invoiceiq_db}
      - POSTGRES_USER=${POSTGRES_USER:-invoiceiq}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-invoiceiq_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AI_SERVICE_URL=http://python-ocr:8000
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-default_dev_token}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
